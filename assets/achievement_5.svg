<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 135" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_achievement_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1420" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="border_achievement_5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Card Container with reduced border thickness (size 1) and curved corners -->
  <rect x="0.5" y="0.5" width="189" height="134" rx="10" ry="10" 
        fill="url(#bg_achievement_5)" stroke="url(#border_achievement_5)" stroke-width="1"/>

  <!-- Icon Container -->
  <rect x="14" y="14" width="32" height="32" rx="7" fill="#151d2a" stroke="#34D399" stroke-opacity="0.3" stroke-width="1"/>
  <g transform="translate(16, 16)">
    <g stroke="#34D399" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="14" cy="14" r="3"/>
          <path d="M5 14 q9 -7.5 18 0 q-9 7.5 -18 0"/>
        </g>
  </g>

  <!-- Rank Badge -->
  <rect x="124" y="18" width="52" height="20" rx="10" fill="#022c22" stroke="#34D399" stroke-opacity="0.45" stroke-width="1"/>
  <text x="150.0" y="31.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" letter-spacing="0.5" fill="#A7F3D0" text-anchor="middle">TOP 2</text>

  <!-- Title -->
  <text x="14" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14.5" fill="#FFFFFF">Track Top 2</text>

  <!-- Event -->
  <text x="14" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">India CV Hackathon</text>

  <!-- External Link Hint -->
  <g transform="translate(168, 113)">
    <path d="M0 6 L6 0 M6 0 H2 M6 0 V4" stroke="#64748B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>