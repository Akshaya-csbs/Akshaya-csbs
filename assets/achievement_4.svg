  </g>

  <!-- Rank Badge -->
  <rect x="120" y="18" width="56" height="20" rx="10" fill="#1e1b4b" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1"/>
  <text x="148.0" y="31.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" letter-spacing="0.5" fill="#C7D2FE" text-anchor="middle">TOP 14</text>

  <!-- Title -->
  <text x="14" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14.5" fill="#FFFFFF">Top 14 Finalist</text>

  <!-- Event -->
