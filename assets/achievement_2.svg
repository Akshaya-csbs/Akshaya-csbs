<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 135" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_achievement_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1420" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="border_achievement_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Card Container with reduced border thickness (size 1) and curved corners -->
  <rect x="0.5" y="0.5" width="189" height="134" rx="10" ry="10" 
        fill="url(#bg_achievement_2)" stroke="url(#border_achievement_2)" stroke-width="1"/>

  <!-- Icon Container -->
  <rect x="14" y="14" width="32" height="32" rx="7" fill="#151d2a" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
  <g transform="translate(16, 16)">
    <g stroke="#38BDF8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="14" cy="14" r="8"/>
          <ellipse cx="14" cy="14" rx="4" ry="8"/>
          <path d="M6 14 h16"/>
        </g>
  </g>

  <!-- Rank Badge -->
  <rect x="114" y="18" width="62" height="20" rx="10" fill="#082f49" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
  <text x="145.0" y="31.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" letter-spacing="0.5" fill="#7DD3FC" text-anchor="middle">TOP 106</text>

  <!-- Title -->
  <text x="14" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14.5" fill="#FFFFFF">Global Top 106</text>

  <!-- Event -->
  <text x="14" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Google Sol. Challenge</text>

  <!-- External Link Hint -->
  <g transform="translate(168, 113)">
    <path d="M0 6 L6 0 M6 0 H2 M6 0 V4" stroke="#64748B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
